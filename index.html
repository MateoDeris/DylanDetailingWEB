<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dylan Detail</title>
<meta name="description" content="Lavação técnica, correção de pintura e higienização premium para o seu veículo. Cada detalhe faz a diferença.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Sora:wght@300;400;500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg: #050505;
    --bg-elevated: #0d0d0e;
    --panel: rgba(255,255,255,0.04);
    --panel-border: rgba(255,255,255,0.08);
    --text: #f5f4f1;
    --text-dim: #9c9a94;
    --text-faint: #605e59;

    --gold: #cda45e;
    --gold-light: #ecd6a6;
    --blue: #3b7dfb;

    --chrome: linear-gradient(100deg, var(--gold), var(--gold-light), var(--blue), var(--gold-light), var(--gold));

    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;

    --ease: cubic-bezier(.16,.84,.44,1);
    --dur: .7s;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    width:100%;
  }

  img{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  section{position:relative; padding:110px 8vw;}
  @media (max-width:780px){ section{padding:72px 6vw;} }
  @media (max-width:480px){ section{padding:60px 5.5vw;} }

  ::selection{ background:var(--gold); color:#0a0a0a; }

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
    border-radius:4px;
  }

  .section-media{ overflow:hidden; }
  .section-media__bg{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    opacity:.24;
    z-index:0;
  }
  .section-media__video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:0;
  }
  .section-media__overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, var(--bg) 0%, rgba(8,9,11,.86) 14%, rgba(8,9,11,.86) 86%, var(--bg) 100%);
    z-index:0;
  }
  .section-media__content{ position:relative; z-index:1; }

  #trabalhos.section-media{ padding:0; min-height:70vh; }
  #trabalhos .section-media__overlay{
    background:linear-gradient(180deg, var(--bg) 0%, rgba(8,9,11,.35) 14%, rgba(8,9,11,.35) 86%, var(--bg) 100%);
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:.22; }
  }
  @keyframes bluePulseSoft{
    0%,100%{ box-shadow:0 0 0 rgba(59,125,251,0); border-color:rgba(59,125,251,.35); }
    50%{ box-shadow:0 0 16px 2px rgba(59,125,251,.45); border-color:rgba(59,125,251,.85); }
  }
  @keyframes btnGlowSlow{
    0%,100%{ box-shadow:0 0 0 rgba(255,59,59,0); }
    8%{ box-shadow:0 0 24px 5px rgba(255,59,59,.6); }
    16%{ box-shadow:0 0 0 rgba(255,59,59,0); }
    33%{ box-shadow:0 0 0 rgba(59,255,140,0); }
    41%{ box-shadow:0 0 24px 5px rgba(59,255,140,.6); }
    49%{ box-shadow:0 0 0 rgba(59,255,140,0); }
    66%{ box-shadow:0 0 0 rgba(59,125,251,0); }
    74%{ box-shadow:0 0 24px 5px rgba(59,125,251,.6); }
    82%{ box-shadow:0 0 0 rgba(59,125,251,0); }
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#a9c6ff;
    margin-bottom:18px;
    padding:6px 14px;
    border:1px solid rgba(59,125,251,.4);
    border-radius:8px;
    background:rgba(59,125,251,.06);
    animation: bluePulseSoft 2.6s ease-in-out infinite;
  }

  .chrome-text{
    background:var(--chrome);
    background-size:250% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:sweep 6s linear infinite, blink 2.2s steps(2, jump-none) infinite;
  }
  @keyframes sweep{
    0%{background-position:0% 50%;}
    100%{background-position:250% 50%;}
  }

  h1,h2,h3{
    font-family:'Syne', sans-serif;
    font-weight:800;
    letter-spacing:-.01em;
    line-height:1.06;
  }

  .section-head{ max-width:640px; margin-bottom:52px; }
  .section-head h2{ font-size:clamp(1.8rem, 3.4vw, 2.8rem); }
  .section-head p{ color:var(--text-dim); margin-top:14px; font-size:1.02rem; max-width:520px; }

  .glass{
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 28px;
    border-radius:100px;
    font-weight:700;
    font-size:.95rem;
    white-space:nowrap;
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s;
    animation: btnGlowSlow 7s ease-in-out infinite;
  }
  .btn-primary{
    background:#fff;
    color:#0a0a0a;
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 30px -8px rgba(205,164,94,.5); }
  .btn-ghost{
    border:1px solid var(--panel-border);
    color:var(--text);
  }
  .btn-ghost:hover{ border-color:rgba(255,255,255,.32); transform:translateY(-2px); }

  .icon-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--panel-border);
    color:var(--text);
    flex-shrink:0;
    transition:transform .35s var(--ease), border-color .35s, background .35s;
  }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn:hover{
    border-color:rgba(255,255,255,.32);
    transform:translateY(-2px);
    background:rgba(255,255,255,.05);
  }

  .reveal{ opacity:0; transform:translateY(26px); transition:opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in-view{ opacity:1; transform:translateY(0); }

  .lang-switch{ display:flex; align-items:center; gap:4px; padding:4px; border-radius:100px; }
  .lang-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    font-size:1.05rem;
    opacity:.5;
    transition:opacity .3s, background .3s, transform .3s;
  }
  .lang-btn:hover{ opacity:.85; transform:translateY(-1px); }
  .lang-btn.active{ opacity:1; background:rgba(255,255,255,.08); }

  .nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 6vw;
    background:#050505;
    border-bottom:1px solid transparent;
    transition:padding .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease);
  }
  .nav.scrolled{
    padding:14px 6vw;
    border-bottom:1px solid var(--panel-border);
    box-shadow:0 10px 30px -14px rgba(0,0,0,.7);
  }
  .nav__logo img{ height:52px; width:auto; }
  .nav__links{ display:flex; align-items:center; }
  .nav__links-inner{ display:flex; flex-direction:row; align-items:center; gap:34px; }
  .nav__links a{
    font-size:.92rem; font-weight:600; color:var(--text-dim);
    position:relative; transition:color .3s;
  }
  .nav__links a::after{
    content:''; position:absolute; left:0; bottom:-6px; width:0; height:1.5px;
    background:var(--chrome); background-size:200% 100%;
    transition:width .35s var(--ease);
  }
  .nav__links a:hover{ color:var(--text); }
  .nav__links a:hover::after{ width:100%; animation:sweep 2.5s linear infinite; }

  .nav__right{ display:flex; align-items:center; gap:14px; }
  .nav__cta{ display:flex; align-items:center; gap:18px; }
  .nav__burger{ display:none; width:26px; height:20px; position:relative; z-index:101; }
  .nav__burger span{
    position:absolute; left:0; width:100%; height:2px; background:var(--text);
    transition:transform .35s var(--ease), opacity .35s var(--ease);
  }
  .nav__burger span:nth-child(1){ top:0; }
  .nav__burger span:nth-child(2){ top:9px; }
  .nav__burger span:nth-child(3){ top:18px; }
  .nav__burger.open span:nth-child(1){ transform:translateY(9px) rotate(45deg); }
  .nav__burger.open span:nth-child(2){ opacity:0; }
  .nav__burger.open span:nth-child(3){ transform:translateY(-9px) rotate(-45deg); }

  .nav__links .lang-switch--mobile{ display:none; }
  .nav__reviews-mobile{ display:none; }
  @keyframes navReviewGlow{
    0%,100%{ box-shadow:0 0 0 rgba(205,164,94,0); }
    50%{ box-shadow:0 0 16px rgba(205,164,94,.42); }
  }

  @media (max-width:900px){
    .nav__links{
      position:absolute; top:calc(100% + 10px); right:0; width:min(70vw,270px); height:auto;
      background:rgba(5,5,5,.98); backdrop-filter:blur(20px);
      flex-direction:column; justify-content:flex-start;
      transform:translateY(-10px) scale(.98); transform-origin:top right;
      opacity:0; pointer-events:none;
      transition:transform .35s var(--ease), opacity .35s var(--ease);
      border:1px solid var(--panel-border); border-radius:12px;
      box-shadow:0 18px 42px rgba(0,0,0,.55);
      overflow-x:hidden; overflow-y:auto;
      max-height:calc(100svh - 96px);
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
      scrollbar-color:rgba(205,164,94,.45) transparent;
      padding:14px 18px 18px 22px;
      touch-action:pan-y;
    }
    .nav__links::-webkit-scrollbar{ width:5px; }
    .nav__links::-webkit-scrollbar-track{ background:transparent; }
    .nav__links::-webkit-scrollbar-thumb{ background:rgba(205,164,94,.45); border-radius:10px; }
    .nav__links::before{
      content:''; position:absolute; top:0; left:0; width:3px; height:100%;
      background:var(--chrome); background-size:100% 400%;
      animation:sweepVertical 4s linear infinite;
    }
    @keyframes sweepVertical{ 0%{background-position:0 0;} 100%{background-position:0 400%;} }
    .nav__links.open{ transform:translateY(0) scale(1); opacity:1; pointer-events:auto; }
    .nav__links-inner{ width:100%; flex-direction:column; align-items:stretch; gap:2px; }
    .nav__links li{ width:100%; }
    .nav__links a{ display:flex; align-items:center; min-height:52px; padding:12px 8px; font-size:1rem; }
    .nav__links a::after{ left:8px; bottom:1px; }
    .nav__reviews-mobile{ display:block; margin-top:6px; padding-top:7px; border-top:1px solid var(--panel-border); }
    .nav__reviews-mobile a{
      color:var(--gold-light);
      background:rgba(205,164,94,.1);
      border:1px solid rgba(205,164,94,.5);
      border-radius:8px;
      animation:navReviewGlow 2.2s ease-in-out infinite;
    }
    .nav__links .lang-switch--mobile{ display:none; }
    .nav__burger{ display:block; }
    .nav__cta .btn-ghost{ display:none; }
    .nav__cta .icon-btn{ display:none; }
    .lang-switch--desktop{ gap:2px; padding:3px; }
    .lang-switch--desktop .lang-btn{ width:30px; height:30px; font-size:.95rem; }
  }

  .hero{
    min-height:100svh;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    padding:0 8vw;
    position:relative;
    overflow:hidden;
  }
  .hero__bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(180deg, rgba(8,9,11,.32) 0%, rgba(8,9,11,.7) 65%, var(--bg) 100%),
      url('img/fondohero.png');
    background-size:cover;
    background-position:center 30%;
    z-index:0;
  }
  @media (max-width:780px){
    .hero{ min-height:88svh; }
    .hero__bg{
      background-size:auto 90%;
      background-position:center 20%;
      background-repeat:no-repeat;
    }
  }
  @media (max-width:480px){
    .hero{ min-height:78svh; }
  }

  @supports (-webkit-touch-callout: none){
    @media (max-width:780px){
      .hero__bg{
        background-image:
          linear-gradient(180deg, rgba(8,9,11,.28) 0%, rgba(8,9,11,.48) 70%, rgba(8,9,11,.82) 94%, var(--bg) 100%),
          url('img/fondohero.png');
        background-size:auto 100%;
      }
    }
  }

  .hero__content{ position:relative; z-index:2; max-width:800px; padding:140px 0 100px; }
  .hero h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(2.5rem, 5.8vw, 4.4rem);
    line-height:1.1;
    letter-spacing:-.01em;
    margin-bottom:24px;
  }
  .hero p{
    font-family:'Sora', sans-serif;
    font-weight:300;
    font-size:clamp(1.02rem, 1.6vw, 1.2rem);
    color:var(--text-dim);
    max-width:520px;
    margin-bottom:34px;
  }

  .carousel{ position:relative; }
  .carousel__viewport{
    overflow:hidden;
    border-radius:var(--radius-lg);
    cursor:grab;
  }
  .carousel__viewport.dragging{ cursor:grabbing; }
  .carousel__track{
    display:flex;
    transition:transform .6s var(--ease);
    will-change:transform;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .carousel__slide{
    flex:0 0 100%;
    aspect-ratio:16/9;
    position:relative;
  }
  .carousel__slide img{
    width:100%; height:100%; object-fit:cover;
    user-select:none; -webkit-user-drag:none;
  }
  .carousel__slide::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.65));
    pointer-events:none;
  }
  .carousel__caption{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:26px 28px;
  }
  .carousel__caption .eyebrow{ margin-bottom:8px; }
  .carousel__caption h3{ font-size:1.25rem; margin-bottom:6px; }
  .carousel__caption p{ color:var(--text-dim); font-size:.92rem; max-width:440px; }
  @media (min-width:781px){
    .carousel__slide{ flex-basis:64%; }
    .carousel__slide + .carousel__slide{ margin-left:20px; }
    .carousel__track{ gap:0; }
  }

  @media (max-width:780px){
    #servicos .carousel__viewport{ border-radius:var(--radius-md); }
    #servicos .carousel__slide{
      aspect-ratio:4/5;
      min-height:420px;
    }
    #servicos .carousel__slide img{ object-fit:contain; object-position:center; }
    #servicos .carousel__caption{ padding:22px 20px 24px; }
    #servicos .carousel__caption h3{ font-size:1.08rem; max-width:300px; }
    #servicos .carousel__caption p{ font-size:.82rem; line-height:1.55; max-width:330px; }
  }

  @media (max-width:480px){
    #servicos .carousel__slide{ aspect-ratio:3/4; min-height:0; }
    #servicos .carousel__controls{ margin-top:20px; }
  }

  .carousel__controls{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:26px;
    flex-wrap:wrap;
    gap:16px;
  }
  .carousel__arrows{ display:flex; gap:10px; }
  .carousel__arrow{
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .3s, transform .3s;
  }
  .carousel__arrow:hover{ border-color:rgba(255,255,255,.35); transform:translateY(-2px); }
  .carousel__arrow svg{ width:18px; height:18px; stroke:var(--text); }

  .carousel__dots{ display:flex; gap:8px; flex-wrap:wrap; }
  .carousel__dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--panel-border);
    transition:background .3s, width .3s;
  }
  .carousel__dot.active{
    width:26px; border-radius:5px;
    background:var(--chrome); background-size:200% 100%;
  }

  .why{
    display:grid; grid-template-columns:1.1fr .9fr; gap:70px; align-items:center;
  }
  @media (max-width:900px){ .why{ grid-template-columns:1fr; gap:40px; } }
  .why h2{ font-size:clamp(1.7rem,3.2vw,2.5rem); margin-bottom:22px; }
  .why p{ color:var(--text-dim); font-size:1.02rem; margin-bottom:16px; max-width:520px; }
  .why__panel{
    border-radius:var(--radius-lg);
    padding:44px 36px;
    position:relative;
    overflow:hidden;
  }
  .why__panel::before{
    content:''; position:absolute; inset:-2px; z-index:-1;
    background:var(--chrome); background-size:220% 100%;
    animation:sweep 8s linear infinite, blink 2.6s steps(2, jump-none) infinite;
    opacity:.5; filter:blur(30px);
  }
  .why__quote{ font-family:'Syne', sans-serif; font-weight:700; font-size:1.35rem; line-height:1.4; }

  .cta{
    text-align:center;
    padding:120px 8vw;
    position:relative;
  }
  .cta__inner{ position:relative; z-index:1; max-width:640px; margin:0 auto; }
  .cta h2{ font-size:clamp(2rem,4.4vw,3.4rem); margin-bottom:26px; }
  .cta p{ color:var(--text-dim); margin-bottom:38px; font-size:1.05rem; }
  .cta__blob{
    position:absolute; left:50%; top:50%; width:600px; height:300px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, rgba(205,164,94,.18), transparent 70%);
    filter:blur(40px); z-index:0;
  }

  footer{
    padding:44px 8vw;
    border-top:1px solid var(--panel-border);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px;
  }
  .footer__brand{ display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
  .footer__logo img{ height:26px; }
  .footer__developer{
    max-width:none;
    color:#8d929c;
    font-family:'Sora', sans-serif;
    font-size:.59rem;
    font-style:italic;
    line-height:1.45;
    letter-spacing:.015em;
    white-space:nowrap;
  }
  .footer__developer-name{
    color:#3b7dfb;
    text-shadow:0 0 8px rgba(59,125,251,.35);
  }
  .footer__meta{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  .footer__links{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
  .footer__links a{ font-size:.88rem; color:var(--text-dim); transition:color .3s; }
  .footer__links a:hover{ color:var(--text); }
  .footer__social{ display:flex; align-items:center; gap:12px; }
  .footer__copy{ font-size:.8rem; color:var(--text-faint); }

  .wa-float{
    position:fixed; bottom:22px; left:22px; z-index:90;
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#fff; color:#0a0a0a;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
    transition:transform .35s var(--ease);
  }
  .wa-float:hover{ transform:scale(1.08); }
  .wa-float svg{ width:25px; height:25px; }
  .wa-float__ring{
    position:absolute; inset:-6px; border-radius:50%;
    border:1.5px solid var(--gold); opacity:.5;
    animation:ring 2.4s ease-out infinite;
  }
  @keyframes ring{
    0%{ transform:scale(.9); opacity:.6; }
    100%{ transform:scale(1.5); opacity:0; }
  }

  @media (max-width:480px){
    .hero__content{ padding:120px 0 70px; }
    .carousel__slide{ aspect-ratio:4/5; }
    .carousel__caption h3{ font-size:1.05rem; }
    .footer__developer{ font-size:.52rem; }
    footer{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="nav" id="nav">
  <a href="#top" class="nav__logo"><img src="img/navbar.png" alt="Dylan Detail"></a>

  <ul class="nav__links" id="navLinks">
    <div class="nav__links-inner">
      <li><a href="#processo" data-i18n="nav.processo"></a></li>
      <li><a href="#servicos" data-i18n="nav.servicos"></a></li>
      <li><a href="#contato" data-i18n="nav.contato"></a></li>
      <li class="nav__reviews-mobile"><a href="dashboard.html" data-i18n="nav.avaliacoes"></a></li>
    </div>
  </ul>

  var htmlLangMap = { es:'es-AR', pt:'pt-BR', en:'en-US' };
  var currentLang = localStorage.getItem('dd_lang') || 'pt';
  if (!i18n[currentLang]) currentLang = 'pt';

  function applyLang(lang){
    currentLang = lang;
    document.documentElement.lang = htmlLangMap[lang];
    var dict = i18n[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){
      var key = el.getAttribute('data-i18n-html');
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    localStorage.setItem('dd_lang', lang);
  }

  function buildLangSwitch(container){
    LANGS.forEach(function(l){
      var b = document.createElement('button');
      b.className = 'lang-btn';
      b.type = 'button';
      b.dataset.lang = l.code;
      b.setAttribute('aria-label', l.label);
      b.textContent = l.flag;
      b.addEventListener('click', function(){ applyLang(l.code); });
      container.appendChild(b);
    });
  }
  document.querySelectorAll('.lang-switch').forEach(buildLangSwitch);

  var nav = document.getElementById('nav');
  window.addEventListener('scroll', function(){
    nav.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive:true });

  var burger = document.getElementById('burger');
  var navLinks = document.getElementById('navLinks');
  burger.addEventListener('click', function(){
    var open = navLinks.classList.toggle('open');
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open);
  });
  navLinks.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      navLinks.classList.remove('open');
      burger.classList.remove('open');
      burger.setAttribute('aria-expanded', false);
    });
  });

  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold:.15 });
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('in-view'); });
  }

  function createCarousel(opts){
    var track = document.getElementById(opts.trackId);
    var dotsWrap = document.getElementById(opts.dotsId);
    var prevBtn = document.getElementById(opts.prevId);
    var nextBtn = document.getElementById(opts.nextId);
    var viewport = track.parentElement;
    var items = opts.items;
    var index = 0;
    var autoplayMs = opts.autoplay || 0;
    var timer = null;

    items.forEach(function(item, i){
      var slide = document.createElement('div');
      slide.className = 'carousel__slide';

      var img = document.createElement('img');
      img.src = item.src;
      img.alt = item.alt || (opts.altPrefix + ' ' + (i + 1));
      img.loading = 'eager';
      img.decoding = 'async';
      img.draggable = false;
      slide.appendChild(img);

      if (item.titleKey){
        var caption = document.createElement('div');
        caption.className = 'carousel__caption';
        var num = document.createElement('span');
        num.className = 'eyebrow';
        num.textContent = (i + 1 < 10 ? '0' : '') + (i + 1);
        var h3 = document.createElement('h3');
        h3.setAttribute('data-i18n', item.titleKey);
        var p = document.createElement('p');
        p.setAttribute('data-i18n', item.descKey);
        caption.appendChild(num);
        caption.appendChild(h3);
        caption.appendChild(p);
        slide.appendChild(caption);
      }

      track.appendChild(slide);

      var dot = document.createElement('button');
      dot.className = 'carousel__dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Slide ' + (i + 1));
      dot.addEventListener('click', function(){ goTo(i); resetAutoplay(); });
      dotsWrap.appendChild(dot);
    });

    var dots = dotsWrap.querySelectorAll('.carousel__dot');
    var slideWidth = function(){ return track.children[0].getBoundingClientRect().width + (window.innerWidth > 780 ? 20 : 0); };

    function update(){
      track.style.transform = 'translate3d(-' + (index * slideWidth()) + 'px, 0, 0)';
      dots.forEach(function(d, i){ d.classList.toggle('active', i === index); });
    }
    function goTo(i){
      index = (i + items.length) % items.length;
      update();
    }
    function next(){ goTo(index + 1); }
    function prev(){ goTo(index - 1); }

    prevBtn.addEventListener('click', function(){ prev(); resetAutoplay(); });
    nextBtn.addEventListener('click', function(){ next(); resetAutoplay(); });
    window.addEventListener('resize', update);

    function startAutoplay(){
      if (!autoplayMs || reduceMotion) return;
      timer = setInterval(next, autoplayMs);
    }
    function resetAutoplay(){
      clearInterval(timer);
      startAutoplay();
    }
    viewport.addEventListener('mouseenter', function(){ clearInterval(timer); });
    viewport.addEventListener('mouseleave', startAutoplay);

    var isDown = false, startX = 0, startIndex = 0, dragDelta = 0;
    function pointerDown(x){
      isDown = true; startX = x; startIndex = index; dragDelta = 0;
      viewport.classList.add('dragging');
      track.style.transition = 'none';
      clearInterval(timer);
    }
    function pointerMove(x){
      if (!isDown) return;
      dragDelta = x - startX;
      track.style.transform = 'translate3d(' + (-(startIndex * slideWidth()) + dragDelta) + 'px, 0, 0)';
    }
    function pointerUp(){
      if (!isDown) return;
      isDown = false;
      viewport.classList.remove('dragging');
      track.style.transition = '';
      if (Math.abs(dragDelta) > slideWidth() * 0.18){
        dragDelta < 0 ? next() : prev();
      } else {
        update();
      }
      resetAutoplay();
    }
    viewport.addEventListener('mousedown', function(e){ pointerDown(e.clientX); });
    window.addEventListener('mousemove', function(e){ pointerMove(e.clientX); });
    window.addEventListener('mouseup', pointerUp);
    viewport.addEventListener('touchstart', function(e){ pointerDown(e.touches[0].clientX); }, { passive:true });
    viewport.addEventListener('touchmove', function(e){ pointerMove(e.touches[0].clientX); }, { passive:true });
    viewport.addEventListener('touchend', pointerUp);

    update();
    startAutoplay();
  }
