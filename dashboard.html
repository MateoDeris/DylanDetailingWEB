<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dylan Detail — Avaliações</title>
<meta name="description" content="Veja o que nossos clientes dizem sobre a Dylan Detail e deixe sua avaliação.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Sora:wght@300;400;500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050505;
    --bg-elevated: #0d0d0e;
    --panel: rgba(255,255,255,0.04);
    --panel-border: rgba(255,255,255,0.08);
    --text: #f5f4f1;
    --text-dim: #9c9a94;
    --text-faint: #605e59;

    --gold: #cda45e;
    --gold-light: #ecd6a6;
    --blue: #3b7dfb;

    --chrome: linear-gradient(100deg, var(--gold), var(--gold-light), var(--blue), var(--gold-light), var(--gold));

    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;

    --ease: cubic-bezier(.16,.84,.44,1);
    --dur: .7s;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    width:100%;
    position:relative;
  }

  .page-bg{
    position:fixed;
    inset:0;
    z-index:-1;
    background-image:
      linear-gradient(180deg, rgba(5,5,5,.86) 0%, rgba(5,5,5,.92) 45%, rgba(5,5,5,.97) 100%),
      url('img/fondo-avaliacoes.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }

  img{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  section{position:relative; padding:100px 8vw;}
  @media (max-width:780px){ section{padding:64px 6vw;} }
  @media (max-width:480px){ section{padding:48px 5vw;} }
  @media (max-width:360px){ section{padding:40px 4.5vw;} }

  ::selection{ background:var(--gold); color:#0a0a0a; }

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
    border-radius:4px;
  }

  .chrome-text{
    background:var(--chrome);
    background-size:250% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:sweep 6s linear infinite;
  }
  @keyframes sweep{
    0%{background-position:0% 50%;}
    100%{background-position:250% 50%;}
  }

  h1,h2,h3{
    font-family:'Syne', sans-serif;
    font-weight:800;
    letter-spacing:-.01em;
    line-height:1.06;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#a9c6ff;
    margin-bottom:18px;
    padding:6px 14px;
    border:1px solid rgba(59,125,251,.4);
    border-radius:8px;
    background:rgba(59,125,251,.06);
  }

  .glass{
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 28px;
    border-radius:100px;
    font-weight:700;
    font-size:.95rem;
    white-space:nowrap;
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s;
  }
  .btn-primary{
    background:#fff;
    color:#0a0a0a;
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 30px -8px rgba(205,164,94,.5); }
  .btn-primary:disabled{ opacity:.6; cursor:default; transform:none; box-shadow:none; }
  .btn-ghost{
    border:1px solid var(--panel-border);
    color:var(--text);
  }
  .btn-ghost:hover{ border-color:rgba(255,255,255,.32); transform:translateY(-2px); }

  .icon-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--panel-border);
    color:var(--text);
    flex-shrink:0;
    transition:transform .35s var(--ease), border-color .35s, background .35s;
  }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn:hover{
    border-color:rgba(255,255,255,.32);
    transform:translateY(-2px);
    background:rgba(255,255,255,.05);
  }

  .reveal{ opacity:0; transform:translateY(26px); transition:opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in-view{ opacity:1; transform:translateY(0); }

  .lang-switch{ display:flex; align-items:center; gap:4px; padding:4px; border-radius:100px; }
  .lang-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    font-size:1.05rem;
    opacity:.5;
    transition:opacity .3s, background .3s, transform .3s;
  }
  .lang-btn:hover{ opacity:.85; transform:translateY(-1px); }
  .lang-btn.active{ opacity:1; background:rgba(255,255,255,.08); }

  /* ============ NAVBAR ============ */
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 6vw;
    background:rgba(5,5,5,.7);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid transparent;
    transition:padding .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease), background .4s var(--ease);
  }
  .nav.scrolled{
    padding:14px 6vw;
    background:rgba(5,5,5,.92);
    border-bottom:1px solid var(--panel-border);
    box-shadow:0 10px 30px -14px rgba(0,0,0,.7);
  }
  .nav__logo{ display:flex; align-items:center; }
  .nav__logo img{ height:52px; width:auto; }
  .nav__links{ display:flex; align-items:center; }
  .nav__links-inner{ display:flex; flex-direction:row; align-items:center; gap:34px; }
  .nav__links a{
    font-size:.92rem; font-weight:600; color:var(--text-dim);
    position:relative; transition:color .3s;
  }
  .nav__links a::after{
    content:''; position:absolute; left:0; bottom:-6px; width:0; height:1.5px;
    background:var(--chrome); background-size:200% 100%;
    transition:width .35s var(--ease);
  }
  .nav__links a:hover{ color:var(--text); }
  .nav__links a:hover::after{ width:100%; animation:sweep 2.5s linear infinite; }
  .nav__links a.active{ color:var(--gold-light); }
  .nav__links a.active::after{ width:100%; background:var(--chrome); background-size:200% 100%; }
  .nav__reviews-mobile{ display:none; }
  @keyframes navReviewGlow{
    0%,100%{ box-shadow:0 0 0 rgba(205,164,94,0); }
    50%{ box-shadow:0 0 16px rgba(205,164,94,.42); }
  }

  .nav__right{ display:flex; align-items:center; gap:14px; }
  .nav__cta{ display:flex; align-items:center; gap:18px; }
  .nav__burger{ display:none; width:26px; height:20px; position:relative; z-index:101; }
  .nav__burger span{
    position:absolute; left:0; width:100%; height:2px; background:var(--text);
    transition:transform .35s var(--ease), opacity .35s var(--ease);
  }
  .nav__burger span:nth-child(1){ top:0; }
  .nav__burger span:nth-child(2){ top:9px; }
  .nav__burger span:nth-child(3){ top:18px; }
  .nav__burger.open span:nth-child(1){ transform:translateY(9px) rotate(45deg); }
  .nav__burger.open span:nth-child(2){ opacity:0; }
  .nav__burger.open span:nth-child(3){ transform:translateY(-9px) rotate(-45deg); }

  @media (max-width:900px){
    .nav__links{
      position:absolute; top:calc(100% + 10px); right:0; width:min(70vw,270px); height:auto;
      background:rgba(5,5,5,.98); backdrop-filter:blur(20px);
      flex-direction:column; justify-content:flex-start;
      transform:translateY(-10px) scale(.98); transform-origin:top right;
      opacity:0; pointer-events:none;
      transition:transform .35s var(--ease), opacity .35s var(--ease);
      border:1px solid var(--panel-border); border-radius:12px;
      box-shadow:0 18px 42px rgba(0,0,0,.55);
      overflow-x:hidden; overflow-y:auto;
      max-height:calc(100svh - 96px);
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
      scrollbar-color:rgba(205,164,94,.45) transparent;
      padding:14px 18px 18px 22px;
      touch-action:pan-y;
    }
    .nav__links::-webkit-scrollbar{ width:5px; }
    .nav__links::-webkit-scrollbar-track{ background:transparent; }
    .nav__links::-webkit-scrollbar-thumb{ background:rgba(205,164,94,.45); border-radius:10px; }
    .nav__links::before{
      content:''; position:absolute; top:0; left:0; width:3px; height:100%;
      background:var(--chrome); background-size:100% 400%;
      animation:sweepVertical 4s linear infinite;
    }
    @keyframes sweepVertical{ 0%{background-position:0 0;} 100%{background-position:0 400%;} }
    .nav__links.open{ transform:translateY(0) scale(1); opacity:1; pointer-events:auto; }
    .nav__links-inner{ width:100%; flex-direction:column; align-items:stretch; gap:2px; }
    .nav__links li{ width:100%; }
    .nav__links a{ display:flex; align-items:center; min-height:52px; padding:12px 8px; font-size:1rem; }
    .nav__links a::after{ left:8px; bottom:1px; }
    .nav__reviews-mobile{ display:block; margin-top:6px; padding-top:7px; border-top:1px solid var(--panel-border); }
    .nav__reviews-mobile a{
      color:var(--gold-light);
      background:rgba(205,164,94,.1);
      border:1px solid rgba(205,164,94,.5);
      border-radius:8px;
      animation:navReviewGlow 2.2s ease-in-out infinite;
    }
    .nav__burger{ display:block; }
    .nav__cta .btn-ghost{ display:none; }
    .nav__cta .icon-btn{ display:none; }
    .lang-switch--desktop{ gap:2px; padding:3px; }
    .lang-switch--desktop .lang-btn{ width:30px; height:30px; font-size:.95rem; }
  }
  @media (max-width:360px){
    .nav__logo img{ height:40px; }
  }

  .top-spacer{ padding-top:150px; }
  @media (max-width:780px){ .top-spacer{ padding-top:118px; } }
  @media (max-width:480px){ .top-spacer{ padding-top:100px; } }
  @media (max-width:360px){ .top-spacer{ padding-top:92px; } }

  .section-head{ max-width:640px; margin-bottom:40px; }
  .section-head h2{ font-size:clamp(1.6rem, 3.4vw, 2.6rem); }

  /* ============ FORM DE AVALIAÇÃO ============ */
  .review-form-wrap{
    display:grid;
    grid-template-columns:1.4fr .9fr;
    gap:0;
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  @media (max-width:820px){ .review-form-wrap{ grid-template-columns:1fr; } }

  .review-form{ padding:48px 44px; }
  @media (max-width:480px){ .review-form{ padding:32px 24px; } }
  @media (max-width:360px){ .review-form{ padding:26px 18px; } }
  .review-form h2{ font-size:clamp(1.35rem,2.8vw,2.1rem); margin-bottom:26px; }

  .star-picker{ display:flex; gap:8px; margin-bottom:28px; }
  .star-picker button{
    width:34px;
    height:34px;
    padding:0;
    font-size:1.6rem;
    line-height:1;
    color:rgba(255,255,255,.2);
    text-shadow:none;
    transition:color .25s, transform .25s, text-shadow .25s, filter .25s;
  }
  .star-picker button:hover,
  .star-picker button:focus-visible,
  .star-picker button.active{
    color:var(--gold-light);
    transform:scale(1.12);
    text-shadow:0 0 7px rgba(205,164,94,.95), 0 0 18px rgba(205,164,94,.65);
    filter:drop-shadow(0 0 5px rgba(205,164,94,.65));
  }
  .star-picker button.active{ animation:starGlow 1.8s ease-in-out infinite; }
  @keyframes starGlow{
    0%,100%{ text-shadow:0 0 5px rgba(205,164,94,.7), 0 0 12px rgba(205,164,94,.4); }
    50%{ text-shadow:0 0 9px rgba(236,214,166,1), 0 0 24px rgba(205,164,94,.8); }
  }
  @media (prefers-reduced-motion: reduce){
    .star-picker button.active{ animation:none; }
  }

  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  @media (max-width:600px){ .form-row{ grid-template-columns:1fr; } }

  .field label{ display:block; font-size:.8rem; color:var(--text-dim); margin-bottom:8px; }
  .field input, .field select, .field textarea{
    width:100%;
    background:rgba(255,255,255,.03);
    border:1px solid var(--panel-border);
    border-radius:var(--radius-sm);
    padding:13px 16px;
    color:var(--text);
    font-family:inherit;
    font-size:.92rem;
    transition:border-color .3s, background .3s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;
    border-color:var(--gold);
    background:rgba(255,255,255,.05);
  }
  .field textarea{ resize:vertical; min-height:110px; }

  .field-checkbox{ display:flex; align-items:flex-start; gap:10px; margin-bottom:26px; font-size:.85rem; color:var(--text-dim); }
  .field-checkbox input{ margin-top:3px; accent-color:var(--gold); flex-shrink:0; }

  .review-form-side{
    background:rgba(59,125,251,.05);
    border-left:1px solid var(--panel-border);
    padding:48px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
  }
  @media (max-width:820px){ .review-form-side{ border-left:none; border-top:1px solid var(--panel-border); padding:32px 24px; } }
  .review-form-side__icon{
    width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(205,164,94,.1);
    color:var(--gold-light);
    margin-bottom:6px;
    flex-shrink:0;
  }
  .review-form-side__icon svg{ width:26px; height:26px; }
  .review-form-side h3{ font-size:1.15rem; }
  .review-form-side p{ color:var(--text-dim); font-size:.88rem; max-width:260px; }

  /* ============ CARROSSEL DE AVALIAÇÕES ============ */
  .carousel{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    max-width:100%;
  }
  .carousel-viewport{
    overflow:hidden;
    flex:1;
    min-width:0;
    border-radius:var(--radius-md);
  }
  .carousel-track{
    display:flex;
    will-change:transform;
    cursor:grab;
    touch-action:pan-y;
  }
  .carousel-track.dragging{ cursor:grabbing; }
  .carousel-slide{
    flex:0 0 auto;
    padding:2px;
    box-sizing:border-box;
    display:flex;
    justify-content:center;
  }
  .carousel-card{
    width:100%;
    max-width:620px;
    border-radius:var(--radius-md);
    padding:32px 30px;
    display:flex;
    flex-direction:column;
    gap:16px;
    min-height:190px;
  }
  .carousel-card__stars{ color:var(--gold-light); font-size:1.05rem; letter-spacing:2px; }
  .carousel-card__quote{ color:var(--text); font-size:clamp(.92rem,1.6vw,1.05rem); line-height:1.7; word-break:break-word; overflow-wrap:anywhere; }
  .carousel-card__author{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:14px; border-top:1px solid var(--panel-border); flex-wrap:wrap; }
  .carousel-card__name{ font-family:'Syne', sans-serif; font-weight:700; font-size:.92rem; word-break:break-word; }
  .carousel-card__verified, .carousel-card__newtag{ font-size:.72rem; color:var(--text-faint); display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .carousel-card__verified svg{ width:13px; height:13px; color:var(--blue); flex-shrink:0; }
  .carousel-card__newtag{ color:var(--gold-light); }
  .carousel-card__tag{ display:inline-block; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); background:rgba(255,255,255,.05); border:1px solid var(--panel-border); border-radius:100px; padding:3px 10px; width:fit-content; }

  .carousel-arrow{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--panel-border);
    background:rgba(255,255,255,.03);
    flex-shrink:0;
    transition:transform .3s var(--ease), border-color .3s, background .3s;
  }
  .carousel-arrow:hover{ border-color:rgba(255,255,255,.32); background:rgba(255,255,255,.06); transform:translateY(-2px); }
  .carousel-arrow svg{ width:19px; height:19px; }
  @media (max-width:600px){
    .carousel{ gap:8px; }
    .carousel-viewport{ width:100%; }
    .carousel-arrow{
      position:relative;
      top:auto;
      width:34px;
      height:34px;
      transform:none;
    }
    .carousel-arrow svg{ width:15px; height:15px; }
    .carousel-card{ padding:24px 22px; min-height:170px; }
  }
  @media (max-width:360px){
    .carousel-card{ padding:20px 14px; gap:12px; }
  }

  .carousel-dots{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:24px; }
  .carousel-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--panel-border);
    transition:width .3s, background .3s;
  }
  .carousel-dot.active{ background:var(--gold-light); width:22px; border-radius:100px; }

  /* ============ SEÇÃO FINAL: AVALIAÇÃO + RESUMO ============ */
  .final-heading{ max-width:640px; margin:0 auto 50px; text-align:center; }
  .final-heading h2{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(1.8rem, 4.2vw, 3.1rem);
    line-height:1.14;
    letter-spacing:-.01em;
    margin-bottom:18px;
  }
  .final-heading p{
    font-family:'Sora', sans-serif;
    font-weight:300;
    font-size:clamp(.95rem, 1.4vw, 1.1rem);
    color:var(--text-dim);
    max-width:480px;
    margin:0 auto;
  }

  .rating-summary{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:50px;
    align-items:center;
    border-radius:var(--radius-lg);
    padding:40px 36px;
    max-width:900px;
    margin:0 auto;
  }
  @media (max-width:700px){
    .rating-summary{ grid-template-columns:1fr; gap:28px; text-align:center; padding:32px 24px; }
  }
  @media (max-width:360px){
    .rating-summary{ padding:26px 18px; }
  }
  .rating-summary__score{ text-align:center; }
  .rating-summary__number{
    font-family:'Syne', sans-serif;
    font-weight:800;
    font-size:clamp(2.6rem,6vw,3.6rem);
    background:var(--chrome); background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:sweep 6s linear infinite;
  }
  .rating-summary__number span{
    font-size:1.3rem;
    color:var(--text-dim);
    -webkit-text-fill-color:var(--text-dim);
  }
  .rating-summary__stars{ margin:8px 0; color:var(--gold-light); font-size:1.1rem; letter-spacing:2px; }
  .rating-summary__label{ font-size:.8rem; color:var(--text-faint); }

  .rating-bars{ display:flex; flex-direction:column; gap:10px; }
  .rating-bar{ display:grid; grid-template-columns:56px 1fr 38px; align-items:center; gap:12px; }
  .rating-bar__label{ font-size:.8rem; color:var(--gold-light); white-space:nowrap; }
  .rating-bar__track{ height:6px; border-radius:100px; background:rgba(255,255,255,.06); overflow:hidden; }
  .rating-bar__fill{ height:100%; width:0%; border-radius:100px; background:var(--chrome); background-size:200% 100%; transition:width 1.2s var(--ease); }
  .rating-bar__pct{ font-size:.78rem; color:var(--text-dim); text-align:right; }

  /* ============ FOOTER ============ */
  footer{
    padding:44px 8vw;
    border-top:1px solid var(--panel-border);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px;
  }
  .footer__brand{ display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
  .footer__logo img{ height:26px; }
  .footer__developer{
    max-width:none;
    color:#8d929c;
    font-family:'Sora', sans-serif;
    font-size:.59rem;
    font-style:italic;
    line-height:1.45;
    letter-spacing:.015em;
    white-space:nowrap;
  }
  .footer__developer-name{
    color:#3b7dfb;
    text-shadow:0 0 8px rgba(59,125,251,.35);
  }

      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-ACCESS-KEY': JSONBIN_ACCESS_KEY
      },
      body: JSON.stringify({ reviews: list })
    })
      .then(function(res){
        if (!res.ok) throw new Error('JSONBin PUT failed: ' + res.status);
        return true;
      })
      .catch(function(err){
        console.error('Error al guardar reseña en JSONBin:', err);
        return false;
      });
  }

  function starString(n){
    n = Math.max(0, Math.min(5, Math.round(n)));
    return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0,5-n);
  }

  function serviceLabel(value, lang){
    var key = serviceKeyMap[value];
    return key ? i18n[lang][key] : '';
  }

  function getCombinedReviews(lang){
    var stored = cachedReviews.slice().sort(function(a,b){ return b.date - a.date; });
    var storedNorm = stored.map(function(r){
      return { name:r.name, rating:r.rating, quote:r.message, service:r.service, isNew:true };
    });
    var seedNorm = (seedReviews[lang] || seedReviews.pt).map(function(r){
      return { name:r.name, rating:5, quote:r.quote, service:'', isNew:false };
    });
    return storedNorm.concat(seedNorm);
  }

  function computeStats(){
    var stored = cachedReviews;
    var counts = {5:5,4:0,3:0,2:0,1:0};
    stored.forEach(function(r){
      var rt = Math.min(5, Math.max(1, parseInt(r.rating,10) || 5));
      counts[rt] = (counts[rt] || 0) + 1;
    });
    var total = 0, sum = 0;
    Object.keys(counts).forEach(function(k){ total += counts[k]; sum += k*counts[k]; });
    return { counts:counts, total:total, avg: total ? sum/total : 5 };
  }

  function renderStats(){
    var stats = computeStats();
    document.querySelectorAll('.rating-bar').forEach(function(bar){
      var star = bar.getAttribute('data-star');
      var pct = stats.total ? Math.round((stats.counts[star] / stats.total) * 100) : 0;
      bar.querySelector('.rating-bar__fill').style.width = pct + '%';
      bar.querySelector('.rating-bar__pct').textContent = pct + '%';
    });
    document.getElementById('scoreNum').textContent = stats.avg.toFixed(1).replace('.', ',');
    document.getElementById('topStars').textContent = starString(stats.avg);
  }

  /* ============ TOAST ============ */
  var toastEl = document.createElement('div');
  toastEl.className = 'toast';
  document.body.appendChild(toastEl);
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 3000);
  }

  /* ============ CARROSSEL EM MOVIMENTO CONTÍNUO ============ */
  var viewport = document.getElementById('carouselViewport');
  var track = document.getElementById('carouselTrack');
  var dotsWrap = document.getElementById('carouselDots');
  var carouselEl = document.getElementById('reviewCarousel');

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var st = {
    list: [],
    slideWidth: 0,
    speed: 0,
    pos: 0,
    paused: false,
    jumping: false,
    dragging: false,
    dragStartX: 0,
    dragStartPos: 0,
    lastTime: null,
    raf: null,
    lastDot: -1
  };

  function cardHTML(r, lang){
    var dict = i18n[lang];
    var tag = r.service ? '<span class="carousel-card__tag">' + serviceLabel(r.service, lang) + '</span>' : '';
    var badge = r.isNew
      ? '<span class="carousel-card__newtag">' + dict['review.new'] + '</span>'
      : '<span class="carousel-card__verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span>' + dict['review.verified'] + '</span></span>';
    return (
      '<div class="carousel-card glass">' +
        '<div class="carousel-card__stars">' + starString(r.rating) + '</div>' +
        (tag ? tag : '') +
        '<p class="carousel-card__quote">' + escapeHtml(r.quote) + '</p>' +
        '<div class="carousel-card__author">' +
          '<span class="carousel-card__name">' + escapeHtml(r.name) + '</span>' +
          badge +
        '</div>' +
      '</div>'
    );
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function wrapPos(p){
    var lw = st.slideWidth * st.list.length;
    if (lw <= 0) return 0;
    p = p % lw;
    if (p < 0) p += lw;
    return p;
  }

  function applyTransform(){
    track.style.transform = 'translateX(' + (-st.pos) + 'px)';
  }

  function updateDots(){
    if (st.slideWidth <= 0 || st.list.length === 0) return;
    var idx = Math.round(st.pos / st.slideWidth) % st.list.length;
    if (idx === st.lastDot) return;
    st.lastDot = idx;
    var dots = dotsWrap.querySelectorAll('.carousel-dot');
    dots.forEach(function(d, i){ d.classList.toggle('active', i === idx); });
  }

  function measure(){
    st.slideWidth = viewport.clientWidth;
    var durationPerSlide = 14; // segundos por cartão
    st.speed = reducedMotion || window.innerWidth <= 600 ? 0 : (st.slideWidth / durationPerSlide);
    var slides = track.children;
    for (var i=0;i<slides.length;i++){ slides[i].style.width = st.slideWidth + 'px'; }
    track.style.width = (st.slideWidth * st.list.length * 2) + 'px';
    st.pos = wrapPos(st.pos);
    applyTransform();
  }

  function renderSlides(){
    track.innerHTML = '';
    var doubled = st.list.concat(st.list);
    doubled.forEach(function(r){
      var slide = document.createElement('div');
      slide.className = 'carousel-slide';
      slide.innerHTML = cardHTML(r, currentLang);
      track.appendChild(slide);
    });
    dotsWrap.innerHTML = '';
    st.list.forEach(function(_, i){
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'carousel-dot';
      dot.setAttribute('aria-label', 'Ir a la reseña ' + (i+1));
      dot.addEventListener('click', function(){ smoothJump((i - Math.round(st.pos/st.slideWidth)) * st.slideWidth); });
      dotsWrap.appendChild(dot);
    });
  }

  /* Estado de carga: mientras la primera consulta a JSONBin no terminó,
     el carrusel muestra un único slide estático con el mensaje traducido. */
  function renderLoadingSlide(){
    st.list = [];
    st.pos = 0;
    st.lastDot = -1;
    track.style.transition = 'none';
    track.innerHTML = '';
    var w = viewport.clientWidth || 0;
    var slide = document.createElement('div');
    slide.className = 'carousel-slide';
    slide.style.width = w + 'px';
    slide.innerHTML = '<div class="carousel-card glass"><p class="carousel-card__quote">' + escapeHtml(i18n[currentLang]['dash.reviews.loading']) + '</p></div>';
    track.appendChild(slide);
    track.style.width = w + 'px';
    applyTransform();
    dotsWrap.innerHTML = '';
  }

  function buildCarousel(lang){
    if (!reviewsLoaded){
      renderLoadingSlide();
      return;
    }
    st.list = getCombinedReviews(lang);
    st.pos = 0;
    st.lastDot = -1;
    renderSlides();
    measure();
    updateDots();
    if (!st.raf) startLoop();
    if (reviewsLoadFailed){
      showToast(i18n[lang]['dash.reviews.error']);
      reviewsLoadFailed = false; // avisar una sola vez por fallo
    }
  }

  function startLoop(){
    function step(ts){
      if (st.lastTime == null) st.lastTime = ts;
      var dt = (ts - st.lastTime) / 1000;
      st.lastTime = ts;
      if (!st.dragging && !st.jumping){
        if (!st.paused && st.speed > 0){
          st.pos = wrapPos(st.pos + st.speed * dt);
        }
        applyTransform();
        updateDots();
      }
      st.raf = requestAnimationFrame(step);
    }
    st.raf = requestAnimationFrame(step);
  }

  function smoothJump(delta){
    if (st.jumping || st.slideWidth <= 0) return;
    st.jumping = true;
    if (window.innerWidth <= 600){
      st.pos = wrapPos(st.pos + delta);
      track.style.transition = 'none';
      applyTransform();
      updateDots();
      st.jumping = false;
      return;
    }
    track.style.transition = 'transform .5s cubic-bezier(.16,.84,.44,1)';
    st.pos = wrapPos(st.pos + delta);
    applyTransform();
    updateDots();
    setTimeout(function(){
      track.style.transition = 'none';
      st.jumping = false;
    }, 520);
  }

  document.getElementById('carouselNext').addEventListener('click', function(){ smoothJump(st.slideWidth); });
  document.getElementById('carouselPrev').addEventListener('click', function(){ smoothJump(-st.slideWidth); });

  carouselEl.addEventListener('mouseenter', function(){ st.paused = true; });
  carouselEl.addEventListener('mouseleave', function(){ st.paused = false; });

  track.addEventListener('pointerdown', function(e){
    st.dragging = true;
    st.dragStartX = e.clientX;
    st.dragStartPos = st.pos;
    track.classList.add('dragging');
    track.style.transition = 'none';
    try{ track.setPointerCapture(e.pointerId); }catch(err){}
  });
  track.addEventListener('pointermove', function(e){
    if (!st.dragging) return;
    var dx = e.clientX - st.dragStartX;
    st.pos = wrapPos(st.dragStartPos - dx);
    applyTransform();
    updateDots();
  });
  function endDrag(){
    if (!st.dragging) return;
    st.dragging = false;
    track.classList.remove('dragging');
    if (window.innerWidth <= 600 && st.slideWidth > 0){
      st.pos = wrapPos(Math.round(st.pos / st.slideWidth) * st.slideWidth);
      track.style.transition = 'transform .35s cubic-bezier(.16,.84,.44,1)';
      applyTransform();
      updateDots();
      setTimeout(function(){ track.style.transition = 'none'; }, 380);
    }
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  track.addEventListener('pointerleave', function(){ if (st.dragging) endDrag(); });

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(measure, 150);
  });

  /* ============ CONTAGEM INICIAL DO RESUMO ============ */
  var statsAnimated = false;
  var ratingSummaryEl = document.getElementById('ratingSummary');
  if ('IntersectionObserver' in window){
    var countObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting && !statsAnimated){
          statsAnimated = true;
          renderStats();
          countObserver.disconnect();
        }
      });
    }, { threshold:.4 });
    countObserver.observe(ratingSummaryEl);
  } else {
    renderStats();
    statsAnimated = true;
  }

  /* ============ FORMULÁRIO ============ */
  var starPicker = document.getElementById('starPicker');
  var starButtons = starPicker.querySelectorAll('button');
  var selectedRating = 0;
  starButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      selectedRating = parseInt(btn.dataset.val, 10);
      starButtons.forEach(function(b){
        var isActive = parseInt(b.dataset.val, 10) <= selectedRating;
        b.classList.toggle('active', isActive);
        b.setAttribute('aria-pressed', isActive);
      });
    });
  });

  var reviewForm = document.getElementById('reviewForm');
  var reviewSubmitBtn = reviewForm.querySelector('button[type="submit"]');
  var reviewSubmitBtnDefaultText = null;

  reviewForm.addEventListener('submit', function(e){
    e.preventDefault();
    var fd = new FormData(reviewForm);
    var name = (fd.get('nome') || '').toString().trim();
    var message = (fd.get('mensagem') || '').toString().trim();
    var service = (fd.get('servico') || '').toString();

    if (!name || !message || selectedRating === 0){
      showToast(i18n[currentLang]['dash.form.needFields']);
      return;
    }

    var newReview = {
      id: Date.now(),
      name: name,
      service: service,
      rating: selectedRating,
      message: message,
      lang: currentLang,
      date: Date.now()
    };

    if (reviewSubmitBtnDefaultText === null && reviewSubmitBtn){
      reviewSubmitBtnDefaultText = reviewSubmitBtn.textContent;
    }
    if (reviewSubmitBtn){
      reviewSubmitBtn.disabled = true;
      reviewSubmitBtn.textContent = i18n[currentLang]['dash.form.sending'];
    }

    // 1) traer las reseñas actuales del Bin, 2) agregar la nueva,
    // 3) actualizar el Bin conservando todas las anteriores.
    loadReviews()
      .then(function(freshList){
        var updated = freshList.concat([newReview]);
        return saveReviews(updated).then(function(ok){
          if (!ok){
            showToast(i18n[currentLang]['dash.form.saveError']);
            return;
          }
          cachedReviews = updated;
          reviewsLoaded = true;

          reviewForm.reset();
          starButtons.forEach(function(b){
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
          });
          selectedRating = 0;

          buildCarousel(currentLang);
          statsAnimated = true;
          renderStats();
          showToast(i18n[currentLang]['dash.form.thanks']);
        });
      })
      .catch(function(err){
        console.error('Error al enviar la reseña:', err);
        showToast(i18n[currentLang]['dash.form.saveError']);
      })
      .finally(function(){
        if (reviewSubmitBtn){
          reviewSubmitBtn.disabled = false;
          reviewSubmitBtn.textContent = reviewSubmitBtnDefaultText;
        }
      });
  });

  /* ============ I18N ============ */
  function applyLang(lang){
    currentLang = lang;
    document.documentElement.lang = htmlLangMap[lang];
    var dict = i18n[lang];
    document.title = dict['page.title'];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){
      var key = el.getAttribute('data-i18n-html');
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      var key = el.getAttribute('data-i18n-placeholder');
      if (dict[key] !== undefined) el.setAttribute('placeholder', dict[key]);
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){
      var key = el.getAttribute('data-i18n-aria');
      if (dict[key] !== undefined) el.setAttribute('aria-label', dict[key]);
    });
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    localStorage.setItem('dd_lang', lang);
    if (reviewSubmitBtnDefaultText !== null && reviewSubmitBtn && !reviewSubmitBtn.disabled){
      reviewSubmitBtnDefaultText = dict['dash.form.submit'];
    }
    buildCarousel(lang);
  }

  function buildLangSwitch(container){
    LANGS.forEach(function(l){
      var b = document.createElement('button');
      b.className = 'lang-btn';
      b.type = 'button';
      b.dataset.lang = l.code;
      b.setAttribute('aria-label', l.label);
      b.textContent = l.flag;
      b.addEventListener('click', function(){ applyLang(l.code); });
      container.appendChild(b);
    });
  }
  document.querySelectorAll('.lang-switch').forEach(buildLangSwitch);

  var nav = document.getElementById('nav');
  window.addEventListener('scroll', function(){
    nav.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive:true });

  var burger = document.getElementById('burger');
  var navLinks = document.getElementById('navLinks');
  burger.addEventListener('click', function(){
    var open = navLinks.classList.toggle('open');
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open);
  });
  navLinks.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      navLinks.classList.remove('open');
      burger.classList.remove('open');
      burger.setAttribute('aria-expanded', false);
    });
  });

  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold:.12 });
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('in-view'); });
  }

  /* ============ INICIALIZACIÓN: primera carga de reseñas desde JSONBin ============ */
  function initReviews(){
    buildCarousel(currentLang); // muestra el estado de carga mientras responde JSONBin
    loadReviews().then(function(list){
      cachedReviews = list;
      reviewsLoaded = true;
      buildCarousel(currentLang);
      renderStats();
    });
  }

  applyLang(currentLang);
  initReviews();
})();
</script>
</body>
</html>
